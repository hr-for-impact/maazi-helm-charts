replicas: 1

image:
  repository: getmeili/meilisearch
  tag: v1.54.3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 200Mi
  limits:
    cpu: '1'
    memory: 1Gi
    ephemeral-storage: 1Gi

persistence:
  size: 10Gi

# Sealed secret deployed manually (same pattern as maazi-backoffice-env):
# data key MEILISEARCH_MASTER_KEY (long random string).
masterKeySecretName: maazi-meilisearch-env
masterKeySecretKey: MEILISEARCH_MASTER_KEY

# Strapi resolves this host; keep single instance, never share across envs.
service:
  port: 7700
