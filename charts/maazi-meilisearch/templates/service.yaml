apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  # ClusterIP: internal only, never exposed outside the cluster
  type: ClusterIP
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: 7700
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
